<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Live Test Right</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #fff;
      }
      #log {
        background: #000;
        padding: 10px;
        height: 300px;
        overflow-y: auto;
        border: 1px solid #333;
      }
      .status-on {
        color: #00ff00;
      }
      .status-off {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting ...</p>
    <form id="message-form">
      <input
        id="message-input"
        type="text"
        placeholder="Send Cargo ..."
        required
      />
      <button type="submit">Deploy Message</button>
    </form>

    <h3>Live Stream Logs:</h3>
    <pre id="log"></pre>
  </body>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const formEl = document.getElementById("message-form");
    const inputEl = document.getElementById("message-input");

    const ws = new WebSocket("ws://localhost:8080");

    const appendLog = (label, message) => {
      const entry = `${new Date().toLocaleTimeString()} ${label}: ${message} \n`;
      logEl.textContent = entry + logEl.textContent;
    };

    ws.addEventListener("open", () => {
      statusEl.textContent = "CONNECTED : ws://localhost:8080";
      statusEl.className = "status-on";
      appendLog("[SYSTEM]", "Tunnel Established");
    });

    ws.addEventListener("close", () => {
      statusEl.textContent = "DISCONNECTED : ws://localhost:8080";
      statusEl.className = "status-off";
      appendLog("[SYSTEM]", "Tunnel Closed");
    });

    ws.addEventListener("message", (e) => {
      appendLog("[RECEIVED]", e.data);
    });

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();

      if (ws.readyState !== WebSocket.OPEN) {
        appendLog("[ERROR]", "No active tunnel found");
        return;
      }
      const msg = inputEl.value.trim();
      ws.send(msg);
      appendLog("[SENT]", msg);
      inputEl.value = "";
    });
  </script>
</html>
